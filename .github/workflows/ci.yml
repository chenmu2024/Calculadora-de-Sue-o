name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate prerendered SEO output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/404.html
          test -f dist/calculadora-horas-de-sueno/index.html
          test -f dist/siestas/index.html
          test -f dist/diario-sueno/index.html
          test -f dist/app-calculadora-de-sueno/index.html
          test -f dist/blog/index.html
          test -f dist/blog/como-calcular-mi-ciclo-de-sueno/index.html
          test -f dist/blog/como-calcular-las-horas-de-sueno/index.html
          test -f dist/blog/guia-ciclo-de-sueno-calculadora/index.html

          grep -q 'data-prerender="true"' dist/index.html
          grep -q 'rel="canonical" href="https://xn--calculadoradesueo-uxb.org/blog/como-calcular-mi-ciclo-de-sueno"' dist/blog/como-calcular-mi-ciclo-de-sueno/index.html
          grep -q 'meta name="robots" content="noindex, follow"' dist/404.html
          grep -q 'https://xn--calculadoradesueo-uxb.org/blog/como-calcular-mi-ciclo-de-sueno' dist/sitemap.xml
          grep -q 'https://xn--calculadoradesueo-uxb.org/calculadora-horas-de-sueno' dist/sitemap.xml
